name: 'One Identity Safeguard Credential Retrieval'
description: 'Retrieves a password or SSH key from One Identity Safeguard using the Application-to-Application (A2A) REST API. Community action, not a One Identity product.'
author: 'chanduvn'

branding:
  icon: 'lock'
  color: 'blue'

inputs:
  appliance_url:
    description: 'The URL of the One Identity Safeguard appliance (e.g., https://safeguard.example.com)'
    required: true
  api_key:
    description: 'The A2A API key for the specific account credential retrieval'
    required: true
  client_certificate:
    description: 'PEM-encoded client certificate for A2A mutual TLS authentication (the certificate content, not a file path)'
    required: true
  client_certificate_key:
    description: 'PEM-encoded private key for the client certificate (the key content, not a file path)'
    required: true
  client_certificate_passphrase:
    description: 'Passphrase for the private key, if encrypted (optional)'
    required: false
    default: ''
  credential_type:
    description: 'What to retrieve: "password" (default) or "ssh_key" (the private key of the account)'
    required: false
    default: 'password'
  ssh_key_format:
    description: 'Format of a retrieved SSH private key: OpenSsh (default), Ssh2 or Putty'
    required: false
    default: 'OpenSsh'
  ca_certificate:
    description: 'PEM-encoded CA certificate (or the appliance certificate itself) to trust for the appliance TLS connection. Use this instead of ignore_ssl when the appliance has a private or self-signed certificate.'
    required: false
    default: ''
  ignore_ssl:
    description: 'Set to "true" to skip TLS certificate verification (development/lab only — never use in production; prefer ca_certificate)'
    required: false
    default: 'false'
  api_version:
    description: 'Safeguard API version to target'
    required: false
    default: '4'

outputs:
  credential:
    description: 'The retrieved secret, whatever its type (masked in logs)'
  password:
    description: 'The retrieved password when credential_type is "password" (masked in logs)'
  private_key:
    description: 'The retrieved SSH private key when credential_type is "ssh_key" (masked in logs, line by line)'

runs:
  using: 'node24'
  main: 'dist/index.js'
